name: Notificar cambios de tareas a Slack

on:
  issues:
    types: [opened, closed, reopened, labeled]

jobs:
  notify-board-move:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar alerta a Slack
        uses: actions/github-script@v6
        with:
          script: |
            const event = context.payload;
            const actor = event.sender.login;
            const issueTitle = event.issue.title;
            const issueUrl = event.issue.html_url;
            const actionType = event.action;
            
            const slackMessage = `🔄 *${actor}* realizó la acción *${actionType}* en el issue: *${issueTitle}*.\n• Enlace: ${issueUrl}`;

            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: slackMessage })
            });
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}