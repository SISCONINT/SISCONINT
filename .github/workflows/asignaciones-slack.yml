name: Asignaciones → Slack
on:
  issues:
    types: [assigned, unassigned]
  pull_request:
    types: [assigned, unassigned]

jobs:
  slack:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ASSIGNEE: ${{ github.event.assignee.login }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          if [ "$ACTION" = "assigned" ]; then
            if [ "$ACTOR" = "$ASSIGNEE" ]; then
              TEXT="👤 *${TITLE}*: ${ACTOR} se autoasignó"
            else
              TEXT="👤 *${TITLE}*: ${ACTOR} asignó a ${ASSIGNEE}"
            fi
          else
            TEXT="👤 *${TITLE}*: ${ACTOR} quitó a ${ASSIGNEE}"
          fi
          TEXT="$TEXT <$URL|ver>"

          jq -n --arg text "$TEXT" '{text:$text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
                --data @- "$SLACK_WEBHOOK_URL"